<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BMW Engine Database</title>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@300;400;600;700;900&family=Barlow:wght@300;400;500&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root {
    --purple: #5c0164;
    --purple-dim: #2f012b;
    --bg: #090909;
    --bg2: #111111;
    --bg3: #181818;
    --border: #222;
    --text: #e8e8e8;
    --text-dim: #666;
    --text-mid: #999;
    --mono: 'Share Tech Mono', monospace;
    --display: 'Barlow Condensed', sans-serif;
    --body: 'Barlow', sans-serif;
  }

  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    background: var(--bg);
    color: var(--text);
    font-family: var(--body);
    min-height: 100vh;
    overflow-x: hidden;
  }

  body::before {
    content: '';
    position: fixed;
    inset: 0;
    background-image:
      linear-gradient(rgba(227,6,19,0.03) 1px, transparent 1px),
      linear-gradient(90deg, rgba(227,6,19,0.03) 1px, transparent 1px);
    background-size: 60px 60px;
    pointer-events: none;
    z-index: 0;
  }

  body::after {
    content: '';
    position: fixed;
    inset: 0;
    background: radial-gradient(ellipse at center, transparent 40%, rgba(0,0,0,0.8) 100%);
    pointer-events: none;
    z-index: 0;
  }

  .container {
    position: relative;
    z-index: 1;
    max-width: 900px;
    margin: 0 auto;
    padding: 0 24px 80px;
  }

  header {
    padding: 48px 0 40px;
    border-bottom: 1px solid var(--border);
    margin-bottom: 48px;
    position: relative;
  }

  .header-top {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    gap: 24px;
  }

  .bmw-logo {
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 16px;
  }

  .logo-circle {
    width: 48px;
    height: 48px;
    border-radius: 50%;
    border: 2px solid var(--purple);
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    overflow: hidden;
    flex-shrink: 0;
  }

  .logo-circle div:nth-child(1) { background: #fff; }
  .logo-circle div:nth-child(2) { background: var(--purple); }
  .logo-circle div:nth-child(3) { background: var(--purple); }
  .logo-circle div:nth-child(4) { background: #fff; }

  .brand-name {
    font-family: var(--display);
    font-weight: 900;
    font-size: 13px;
    letter-spacing: 0.3em;
    color: var(--text-dim);
    text-transform: uppercase;
  }

  h1 {
    font-family: var(--display);
    font-weight: 900;
    font-size: clamp(42px, 7vw, 72px);
    line-height: 0.9;
    letter-spacing: -0.01em;
    text-transform: uppercase;
    color: var(--text);
    margin-bottom: 12px;
  }

  h1 span { color: var(--purple); display: block; }

  .header-sub {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .status-badge {
    display: flex;
    align-items: center;
    gap: 8px;
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    flex-shrink: 0;
    margin-top: 4px;
  }

  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: #22c55e;
    animation: pulse 2s ease-in-out infinite;
  }

  @keyframes pulse {
    0%, 100% { opacity: 1; box-shadow: 0 0 0 0 rgba(34,197,94,0.4); }
    50% { opacity: 0.7; box-shadow: 0 0 0 4px rgba(34,197,94,0); }
  }

  .search-section { margin-bottom: 40px; }

  .search-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--text-dim);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: block;
  }

  .search-wrap {
    position: relative;
  }

  .search-wrap::before {
    content: '>';
    position: absolute;
    left: 20px;
    top: 50%;
    transform: translateY(-50%);
    font-family: var(--mono);
    font-size: 16px;
    color: var(--purple);
    pointer-events: none;
    z-index: 1;
  }

  #query {
    width: 100%;
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--purple);
    color: var(--text);
    font-family: var(--mono);
    font-size: 16px;
    padding: 18px 140px 18px 44px;
    outline: none;
    transition: border-color 0.2s, background 0.2s;
    letter-spacing: 0.05em;
  }

  #query:focus {
    border-color: var(--purple);
    background: var(--bg3);
    box-shadow: 0 0 0 1px rgba(227,6,19,0.2), inset 0 0 30px rgba(227,6,19,0.03);
  }

  #submitBtn {
    position: absolute;
    right: 0;
    top: 0;
    bottom: 0;
    padding: 0 24px;
    background: var(--purple);
    border: none;
    color: #fff;
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    cursor: pointer;
  }

  #submitBtn:hover { background: #ff0a1a; }

  .quick-filters {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-top: 14px;
  }

  .chip {
    font-family: var(--mono);
    font-size: 11px;
    letter-spacing: 0.08em;
    color: var(--text-dim);
    background: transparent;
    border: 1px solid var(--border);
    padding: 5px 12px;
    cursor: pointer;
    transition: all 0.15s;
    text-transform: uppercase;
  }

  .chip:hover {
    color: var(--purple);
    border-color: var(--purple);
    background: rgba(227,6,19,0.05);
  }

  #results { animation: fadeIn 0.3s ease; }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(8px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .result-header {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    margin-bottom: 24px;
    padding-bottom: 16px;
    border-bottom: 1px solid var(--border);
  }

  .result-model {
    font-family: var(--display);
    font-weight: 900;
    font-size: 48px;
    letter-spacing: -0.02em;
    color: var(--text);
    text-transform: uppercase;
    line-height: 1;
  }

  .result-model span { color: var(--purple); }

  .result-meta {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
    text-align: right;
  }

  .section-title {
    font-family: var(--display);
    font-weight: 700;
    font-size: 11px;
    letter-spacing: 0.25em;
    color: var(--purple);
    text-transform: uppercase;
    margin-bottom: 12px;
    display: flex;
    align-items: center;
    gap: 10px;
  }

  .section-title::after {
    content: '';
    flex: 1;
    height: 1px;
    background: var(--border);
  }

  .engines-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 1px;
    background: var(--border);
    margin-bottom: 32px;
  }

  .engine-card {
    background: var(--bg2);
    padding: 20px;
    transition: background 0.15s;
  }

  .engine-card:hover { background: var(--bg3); }

  .engine-code {
    font-family: var(--mono);
    font-size: 20px;
    color: var(--purple);
    letter-spacing: 0.05em;
    margin-bottom: 6px;
  }

  .engine-name {
    font-size: 13px;
    color: var(--text);
    margin-bottom: 12px;
    font-weight: 500;
    line-height: 1.4;
  }

  .engine-meta {
    display: flex;
    gap: 16px;
  }

  .meta-label {
    font-family: var(--mono);
    font-size: 9px;
    color: var(--text-dim);
    letter-spacing: 0.15em;
    text-transform: uppercase;
  }

  .meta-value {
    font-family: var(--display);
    font-weight: 600;
    font-size: 16px;
    color: var(--text);
  }

  .fuel-badge {
    display: inline-block;
    font-family: var(--mono);
    font-size: 9px;
    letter-spacing: 0.12em;
    text-transform: uppercase;
    padding: 3px 8px;
    margin-bottom: 10px;
    border: 1px solid;
  }

  .fuel-petrol { color: #f59e0b; border-color: rgba(245,158,11,0.3); background: rgba(245,158,11,0.05); }
  .fuel-diesel { color: #60a5fa; border-color: rgba(96,165,250,0.3); background: rgba(96,165,250,0.05); }
  .fuel-hybrid { color: #34d399; border-color: rgba(52,211,153,0.3); background: rgba(52,211,153,0.05); }

  .best-card {
    background: var(--bg2);
    border: 1px solid var(--border);
    border-left: 3px solid var(--purple);
    padding: 24px;
    margin-bottom: 32px;
  }

  .best-label {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.2em;
    color: var(--purple);
    text-transform: uppercase;
    margin-bottom: 8px;
  }

  .best-name {
    font-family: var(--display);
    font-weight: 700;
    font-size: 28px;
    color: var(--text);
    margin-bottom: 10px;
    letter-spacing: -0.01em;
  }

  .best-reason {
    font-size: 14px;
    color: var(--text-mid);
    line-height: 1.6;
  }

  .trans-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 1px;
    background: var(--border);
    margin-bottom: 32px;
  }

  .trans-card {
    background: var(--bg2);
    padding: 16px 20px;
  }

  .trans-type {
    font-family: var(--display);
    font-weight: 700;
    font-size: 13px;
    letter-spacing: 0.1em;
    text-transform: uppercase;
    color: var(--text-dim);
    margin-bottom: 8px;
  }

  .trans-item {
    display: flex;
    align-items: baseline;
    gap: 8px;
    padding: 4px 0;
    border-bottom: 1px solid rgba(255,255,255,0.04);
  }

  .trans-speeds {
    font-family: var(--mono);
    font-size: 18px;
    color: var(--purple);
  }

  .trans-name {
    font-size: 12px;
    color: var(--text-mid);
  }

  .error-block {
    border: 1px solid rgba(227,6,19,0.3);
    background: rgba(227,6,19,0.05);
    padding: 20px 24px;
  }

  .error-code {
    font-family: var(--mono);
    font-size: 10px;
    letter-spacing: 0.15em;
    color: var(--purple);
    margin-bottom: 6px;
    text-transform: uppercase;
  }

  .avail-models {
    margin-top: 12px;
    display: flex;
    gap: 6px;
    flex-wrap: wrap;
  }

  .avail-chip {
    font-family: var(--mono);
    font-size: 11px;
    color: var(--text-dim);
    border: 1px solid var(--border);
    padding: 3px 10px;
    cursor: pointer;
  }

  .avail-chip:hover {
    color: var(--purple);
    border-color: var(--purple);
  }

  .loading {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 32px 0;
    font-family: var(--mono);
    font-size: 12px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  .loading-bar {
    width: 120px;
    height: 2px;
    background: var(--border);
    position: relative;
    overflow: hidden;
  }

  .loading-bar::after {
    content: '';
    position: absolute;
    inset: 0;
    background: var(--purple);
    animation: load 0.8s ease infinite;
  }

  @keyframes load {
    0% { transform: scaleX(0); }
    50% { transform: scaleX(1); }
    100% { transform: scaleX(0); }
  }

  .empty-state {
    padding: 64px 0;
    text-align: center;
  }

  .empty-icon {
    font-family: var(--display);
    font-size: 72px;
    font-weight: 900;
    color: var(--border);
    letter-spacing: -0.04em;
  }

  footer {
    margin-top: 80px;
    padding-top: 24px;
    border-top: 1px solid var(--border);
    display: flex;
    justify-content: space-between;
    align-items: center;
    flex-wrap: wrap;
    gap: 12px;
  }

  footer span {
    font-family: var(--mono);
    font-size: 10px;
    color: var(--text-dim);
    letter-spacing: 0.1em;
  }

  footer a { color: var(--purple); text-decoration: none; }
</style>
</head>
<body>
<div class="container">
  <header>
    <div class="header-top">
      <div>
        <div class="bmw-logo">
          <div class="logo-circle">
            <div></div><div></div><div></div><div></div>
          </div>
          <span class="brand-name">Cars Data API</span>
        </div>
        <h1>Engine<span>Database</span></h1>
        <div class="header-sub"> · Engines · Transmissions · Specs · </div>
      </div>
      <div class="status-badge">
        <div class="status-dot"></div>
        <span>API ONLINE</span>
      </div>
    </div>
  </header>

  <section class="search-section">
    <span class="search-label">// Query interface</span>
    <div class="search-wrap">
      <input
        type="text"
        id="query"
        placeholder=" ·  e.g.  e90  ·  f30 petrol  ·  g20 best diesel  ·  "
        autocomplete="off"
        spellcheck="false"
      />
      <button id="submitBtn" onclick="runQuery()">QUERY</button>
    </div>
    <div class="quick-filters">
      <button class="chip" onclick="setQuery('E90')">E90</button>
      <button class="chip" onclick="setQuery('F30')">F30</button>
      <button class="chip" onclick="setQuery('G20')">G20</button>
      <button class="chip" onclick="setQuery('E90 petrol')">E90 petrol</button>
      <button class="chip" onclick="setQuery('G20 best diesel')">G20 best diesel</button>
    </div>
  </section>

  <div id="results">
    <div class="empty-state">
      <div class="empty-icon">Danio06</div>
      <div class="empty-text">· Enter a model to begin ·</div>
    </div>
  </div>

  <footer>
    <span>CARS DATA API · <a href="https://github.com/Danio06/Cars-Data-API" target="_blank">github.com/Danio06</a></span>
    <span style="font-size: 10px; color: var(--text-dim); letter-spacing: 0.03em;">
      Frontend by Grok &amp; Claude, desing by Daniel
    </span>
    <span>PYTHON · FASTAPI · SQLITE</span>
  </footer>
</div>

<script>
  // CONFIG
  const API_BASE = 'https://cars-data-api.onrender.com';
  
  // UI Helpers
  function setQuery(val) {
    document.getElementById('query').value = val;
    runQuery();
  }
  
  function getFuelClass(fuel) {
    if (!fuel) return '';
    return 'fuel-' + fuel.toLowerCase();
  }
  
  function renderLoading() {
    document.getElementById('results').innerHTML = `
      <div class="loading">
        <div class="loading-bar"></div>
        QUERYING DATABASE
      </div>`;
  }
  
  function renderError(msg) {
    document.getElementById('results').innerHTML = `
      <div class="error-block">
        <div class="error-code">// ERROR</div>
        <div class="error-msg">${msg}</div>
      </div>`;
  }
  
  function renderResults(data) {
    const generations = data.generations || {};
  
    if (Object.keys(generations).length === 0) {
      return renderError("No results found.");
    }
  
    let html = '';
  
    Object.entries(generations).forEach(([modelName, genData]) => {
      const engines = genData.engines || [];
      const transmissions = genData.transmission || {};
      const best = genData.best_engine;
  
      html += `
        <div class="result-header">
          <div class="result-model">${modelName} <span>·</span></div>
          <div class="result-meta">${engines.length} ENGINE${engines.length !== 1 ? 'S' : ''} FOUND</div>
        </div>`;
  
      // Best Engine
      if (best && best.model) {
        html += `
          <div class="section-title">Recommended Engine</div>
          <div class="best-card">
            <div class="best-label">// top pick</div>
            <div class="best-name">${best.model}</div>
            <div class="best-reason">${best.reason || 'Excellent performance and reliability.'}</div>
          </div>`;
      }
  
      // Engines
      if (engines.length > 0) {
        html += `<div class="section-title">Engines</div><div class="engines-grid">`;
        engines.forEach(e => {
          const fuel = e.fuel || (
            e.engine && /d/i.test(e.engine) ? 'diesel' : 'petrol'
          );
          html += `
            <div class="engine-card">
              ${fuel ? `<span class="fuel-badge ${getFuelClass(fuel)}">${fuel}</span>` : ''}
              <div class="engine-code">${e.engine || '—'}</div>
              <div class="engine-name">${e.model || ''}</div>
              <div class="engine-meta">
                <div class="meta-item">
                  <span class="meta-label">Power</span>
                  <span class="meta-value">${e.power} KM</span>
                </div>
              </div>
            </div>`;
        });
        html += `</div>`;
      }
  
      // Transmissions
      if (Object.keys(transmissions).length > 0) {
        html += `<div class="section-title">Transmissions</div><div class="trans-grid">`;
        Object.entries(transmissions).forEach(([type, items]) => {
          html += `<div class="trans-card"><div class="trans-type">${type}</div>`;
          (items || []).forEach(t => {
            html += `
              <div class="trans-item">
                <span class="trans-speeds">${t.speeds}</span>
                <span class="trans-name">${t.type}</span>
              </div>`;
          });
          html += `</div>`;
        });
        html += `</div>`;
      }
  
      html += `<div style="margin-bottom: 50px;"></div>`;
    });
  
    document.getElementById('results').innerHTML = html;
  }

  async function runQuery() {
    const query = document.getElementById('query').value.trim();
    if (!query) return;
  
    renderLoading();
  
    try {
      const res = await fetch(`${API_BASE}/search?q=${encodeURIComponent(query)}`, {
        method: 'GET',
        headers: { 'Accept': 'application/json' },
        signal: AbortSignal.timeout(6000)
      });
  
      if (!res.ok) {
        throw new Error(`HTTP error! status: ${res.status}`);
      }
  
      const data = await res.json();
  
      if (data.status === "error") {
        renderError(data.message || "Unknown error from API");
      } else {
        renderResults(data);
      }
  
    } catch (err) {
      console.error("Fetch error:", err);
      renderError(`
        Cannot connect to API.<br><br>
        <strong>Check if API is working.</strong><br>
        <code>Let the creator know</code><br><br>
      `);
    }
  }
  document.getElementById('query').addEventListener('keydown', e => {
    if (e.key === 'Enter') runQuery();
  });
  </script>
</body>
</html>
